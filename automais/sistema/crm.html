function sbCollapse(){
  var sb = document.getElementById('sb');
  var ml = document.querySelector('.layout-main');
  if(!sb) return;
  var col = sb.classList.toggle('sb-collapsed');
  localStorage.setItem('sb_col', col ? '1' : '0');
  if(ml) ml.style.marginLeft = col ? 'var(--sidebar-collapsed-w)' : 'var(--sidebar-w)';
  var btn = document.getElementById('sb-toggle-btn');
  if(btn) btn.innerHTML = col ? '&#9656;' : '&#9666;';
}
(function(){
  if(localStorage.getItem('sb_col') === '1'){
    var sb = document.getElementById('sb');
    var ml = document.querySelector('.layout-main');
    var btn = document.getElementById('sb-toggle-btn');
    if(sb) sb.classList.add('sb-collapsed');
    if(ml) ml.style.marginLeft = 'var(--sidebar-collapsed-w)';
    if(btn) btn.innerHTML = '&#9656;';
  }
})();


// ── Theme toggle ─────────────────────────────────────────────
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('am_theme', next);
  updateThemeBtn(next);
}
function updateThemeBtn(theme) {
  var icon  = document.getElementById('theme-icon');
  var label = document.getElementById('theme-label');
  if(icon)  icon.setAttribute('data-lucide', theme === 'dark' ? 'moon' : 'sun');
  if(label) label.textContent = theme === 'dark' ? 'Tema Escuro' : 'Aparência';
  if(typeof lucide !== 'undefined') lucide.createIcons();
}
(function(){
  var saved = localStorage.getItem('am_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  // Apply after DOM ready
  document.addEventListener('DOMContentLoaded', function(){ updateThemeBtn(saved); });
})();

// ── Sidebar mobile ────────────────────────────────────────────
function tsb() {
  var sb = document.getElementById('sb');
  var ov = document.getElementById('sb-overlay');
  if(!sb) return;
  sb.classList.toggle('open');
  if(ov) ov.classList.toggle('open');
}
function csb() {
  var sb = document.getElementById('sb');
  var ov = document.getElementById('sb-overlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('open');
}

// ── Lucide init + reinit helper ───────────────────────────────
function renderIcons() {
  if(typeof lucide !== 'undefined') {
    try { lucide.createIcons(); } catch(e) {}
  }
}

// ── Avatar initials ───────────────────────────────────────────
function setAvatar(name) {
  var el = document.getElementById('avatar-initials');
  if(el && name) el.textContent = name.charAt(0).toUpperCase();
}

// ── Admin nav ─────────────────────────────────────────────────
function applyProfile() {
  if(!isAdmin()) {
    document.querySelectorAll('[data-admin-only]').forEach(function(el){
      el.style.display = 'none';
    });

}


// ── Toast (design system) ─────────────────────────────────────
(function(){
  var stack = document.createElement('div');
  stack.className = 'toast-stack';
  document.body.appendChild(stack);
  
  window.toast = function(msg, type, dur) {
    type = type || 'ok';
    dur  = dur  || 3000;
    var icons = {ok:'check',err:'x-circle',warn:'alert-triangle',info:'info'};
    var el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.innerHTML = '<i data-lucide="' + (icons[type]||'check') + '"></i><span>' + msg + '</span>';
    stack.appendChild(el);
    if(typeof lucide !== 'undefined') lucide.createIcons({nodes:[el]});
    setTimeout(function(){
      el.style.animation = 'toastOut 300ms ease forwards';
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, dur);
  };
})();

// ═══════════════════════════════════════════════════════════════
// CRM — funil de vendas da Auto Mais
// Coleção Firestore: "leads" (não está em COLS do firebase-shared.js,
// por isso é carregada aqui à parte).
// ═══════════════════════════════════════════════════════════════

var ETAPAS = [
  {k:'novo',     n:'Novo',             cor:'#6b7280'},
  {k:'contato',  n:'Em contato',       cor:'#3b82f6'},
  {k:'visita',   n:'Visita',           cor:'#8b5cf6'},
  {k:'proposta', n:'Proposta',         cor:'#f59e0b'},
  {k:'banco',    n:'Análise do banco', cor:'#0ea5e9'},
  {k:'fechado',  n:'Fechado',          cor:'#16a34a'},
  {k:'perdido',  n:'Perdido',          cor:'#dc2626'}
];
var ORIGENS = ['OLX','Webmotors','Instagram','Facebook','Indicação','Passou na loja','Telefone','Outro'];

var LEADS = [];
var _fCrm = { q:'', vendedor:'', origem:'', soAtrasados:false };
var _crmCarregando = true;

function _etapa(k){
  for (var i=0;i<ETAPAS.length;i++) if (ETAPAS[i].k===k) return ETAPAS[i];
  return ETAPAS[0];
}
function _hoje(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
// Lead atrasado: tem data de retorno vencida e ainda está em aberto
function _atrasado(l){
  if (!l || !l.proximo_contato) return false;
  if (l.etapa==='fechado' || l.etapa==='perdido') return false;
  return l.proximo_contato < _hoje();
}
function _aberto(l){ return l && l.etapa!=='fechado' && l.etapa!=='perdido'; }
function _esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _soDigitos(s){ return String(s||'').replace(/[^0-9]/g,''); }

// ── Carregamento ──────────────────────────────────────────────
function carregarLeads(){
  if (typeof fdb === 'undefined' || !fdb) return Promise.resolve();
  return fdb.collection('leads').get().then(function(snap){
    LEADS = snap.docs.map(function(d){ return d.data(); }).filter(Boolean);
  }).catch(function(e){
    console.warn('[crm] não consegui ler os leads:', e.message);
    // Sem banco, ao menos o que estiver em cache local
    try { LEADS = (JSON.parse(localStorage.getItem('automais_leads')||'[]'))||[]; } catch(e2){ LEADS=[]; }
  });
}
function salvarCacheLeads(){
  try { localStorage.setItem('automais_leads', JSON.stringify(LEADS)); } catch(e){}
}

// ── Filtro ────────────────────────────────────────────────────
function leadsFiltrados(){
  var q = (_fCrm.q||'').toLowerCase().trim();
  return LEADS.filter(function(l){
    if (!l) return false;
    if (_fCrm.vendedor && l.vendedor !== _fCrm.vendedor) return false;
    if (_fCrm.origem   && l.origem   !== _fCrm.origem)   return false;
    if (_fCrm.soAtrasados && !_atrasado(l)) return false;
    if (!q) return true;
    var alvo = (l.nome||'')+' '+(l.telefone||'')+' '+(l.email||'')+' '+
               (typeof vNome==='function' ? vNome(l.veiculo_id) : '')+' '+(l.obs||'');
    return alvo.toLowerCase().indexOf(q) >= 0;
  });
}

// ── Render ────────────────────────────────────────────────────
function renderCRM(){
  var lista = leadsFiltrados();
  var abertos   = lista.filter(_aberto).length;
  var atrasados = lista.filter(_atrasado).length;
  var mes = _hoje().slice(0,7);
  var fechadosMes = lista.filter(function(l){
    return l.etapa==='fechado' && String(l.fechadoEm||l.atualizadoEm||'').slice(0,7)===mes;
  }).length;

  var vendedores = ((typeof DB!=='undefined' && DB.usuarios) || []).filter(Boolean);

  var html =
    '<div class="ph"><div><div class="pt">CRM</div>'
    + '<div class="ps">Funil de vendas — quem está interessado e em que pé está</div></div>'
    + '<button class="btn bp" onclick="fmLead(null)">+ Novo interessado</button></div>';

  // Resumo
  html += '<div class="crm-resumo">'
    + '<div class="crm-kpi"><div class="crm-kpi-l">Em aberto</div><div class="crm-kpi-v">'+abertos+'</div></div>'
    + '<div class="crm-kpi'+(atrasados?' crm-kpi-alerta':'')+'"><div class="crm-kpi-l">Retorno atrasado</div>'
      + '<div class="crm-kpi-v">'+atrasados+'</div></div>'
    + '<div class="crm-kpi"><div class="crm-kpi-l">Fechados no mês</div><div class="crm-kpi-v">'+fechadosMes+'</div></div>'
    + '</div>';

  // Filtros
  html += '<div class="crm-filtros">'
    + '<input id="crmQ" class="crm-inp" placeholder="Buscar por nome, telefone ou carro..." value="'+_esc(_fCrm.q)+'" oninput="_fCrm.q=this.value;renderCRM();_focoBusca()">'
    + '<select class="crm-inp" onchange="_fCrm.vendedor=this.value;renderCRM()"><option value="">Todos os vendedores</option>'
    + vendedores.map(function(u){
        var v=u.login||u.id;
        return '<option value="'+_esc(v)+'"'+(_fCrm.vendedor===v?' selected':'')+'>'+_esc(u.nome||v)+'</option>';
      }).join('')
    + '</select>'
    + '<select class="crm-inp" onchange="_fCrm.origem=this.value;renderCRM()"><option value="">Todas as origens</option>'
    + ORIGENS.map(function(o){ return '<option'+(_fCrm.origem===o?' selected':'')+'>'+_esc(o)+'</option>'; }).join('')
    + '</select>'
    + '<label class="crm-chk"><input type="checkbox"'+(_fCrm.soAtrasados?' checked':'')
      + ' onchange="_fCrm.soAtrasados=this.checked;renderCRM()"> Só os atrasados</label>'
    + '</div>';

  if (_crmCarregando) {
    html += '<div class="empty">Carregando os interessados...</div>';
  } else if (!LEADS.length) {
    html += '<div class="empty" style="padding:40px 16px">'
      + '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Nenhum interessado cadastrado ainda</div>'
      + '<div style="font-size:12px;opacity:.75;margin-bottom:14px">Cadastre quem entrar em contato — por telefone, WhatsApp, OLX ou passando na loja — e acompanhe até a venda.</div>'
      + '<button class="btn bp" onclick="fmLead(null)">+ Cadastrar o primeiro</button></div>';
  } else {
    // Kanban
    html += '<div class="crm-board">';
    ETAPAS.forEach(function(e){
      var doGrupo = lista.filter(function(l){ return (l.etapa||'novo')===e.k; });
      html += '<div class="crm-col" ondragover="_dragOver(event)" ondragleave="_dragLeave(event)" ondrop="_drop(event,\''+e.k+'\')" data-etapa="'+e.k+'">'
        + '<div class="crm-col-head"><span class="crm-dot" style="background:'+e.cor+'"></span>'
        + '<span class="crm-col-nome">'+e.n+'</span><span class="crm-col-n">'+doGrupo.length+'</span></div>'
        + '<div class="crm-col-body">'
        + (doGrupo.length ? doGrupo.map(cardLead).join('')
            : '<div class="crm-vazio">—</div>')
        + '</div></div>';
    });
    html += '</div>';
  }

  document.getElementById('main').innerHTML = html;
  if (typeof renderIcons==='function') renderIcons();
}
// Mantém o cursor na busca depois do re-render
function _focoBusca(){
  var el=document.getElementById('crmQ');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function cardLead(l){
  var atras = _atrasado(l);
  var carro = (typeof vNome==='function' && l.veiculo_id) ? vNome(l.veiculo_id) : '';
  var tel   = _soDigitos(l.telefone);
  return '<div class="crm-card'+(atras?' crm-card-atraso':'')+'" draggable="true"'
    + ' ondragstart="_dragStart(event,\''+_esc(l.id)+'\')" ondragend="_dragEnd(event)"'
    + ' onclick="fmLead(\''+_esc(l.id)+'\')">'
    + '<div class="crm-card-nome">'+_esc(l.nome||'(sem nome)')+'</div>'
    + (carro ? '<div class="crm-card-carro">'+_esc(carro)+'</div>' : '')
    + '<div class="crm-card-meta">'
      + (l.origem ? '<span class="crm-tag">'+_esc(l.origem)+'</span>' : '')
      + (l.troca ? '<span class="crm-tag crm-tag-troca">troca</span>' : '')
    + '</div>'
    + (l.proximo_contato
        ? '<div class="crm-card-data'+(atras?' crm-atraso-txt':'')+'">'
          + (atras?'Atrasado desde ':'Retornar em ')
          + (typeof fd==='function'?fd(l.proximo_contato):l.proximo_contato)+'</div>'
        : '')
    + '<div class="crm-card-pe">'
      + '<span class="crm-vend">'+_esc(_nomeVendedor(l.vendedor))+'</span>'
      + (tel ? '<a class="crm-zap" title="Abrir conversa no WhatsApp" onclick="event.stopPropagation()"'
             + ' href="https://wa.me/55'+tel+'" target="_blank" rel="noopener">WhatsApp</a>' : '')
    + '</div></div>';
}
function _nomeVendedor(login){
  if (!login) return '—';
  var us = ((typeof DB!=='undefined' && DB.usuarios)||[]).filter(Boolean);
  for (var i=0;i<us.length;i++) if ((us[i].login||us[i].id)===login) return us[i].nome||login;
  return login;
}

// ── Arrastar entre colunas ────────────────────────────────────
var _arrastando = null;
function _dragStart(ev,id){ _arrastando=id; try{ev.dataTransfer.effectAllowed='move';}catch(e){} }
function _dragEnd(ev){ _arrastando=null;
  Array.prototype.forEach.call(document.querySelectorAll('.crm-col'),function(c){c.classList.remove('crm-col-alvo');}); }
function _dragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('crm-col-alvo'); }
function _dragLeave(ev){ ev.currentTarget.classList.remove('crm-col-alvo'); }
function _drop(ev,etapa){
  ev.preventDefault();
  ev.currentTarget.classList.remove('crm-col-alvo');
  if (!_arrastando) return;
  moverLead(_arrastando, etapa);
  _arrastando = null;
}
function moverLead(id, etapa){
  var l = LEADS.find(function(x){ return x && String(x.id)===String(id); });
  if (!l || l.etapa===etapa) return;
  l.etapa = etapa;
  l.atualizadoEm = new Date().toISOString();
  if (etapa==='fechado') l.fechadoEm = l.atualizadoEm;
  salvarCacheLeads();
  if (typeof fsave==='function') fsave('leads', l);
  renderCRM();
  toast('Movido para "'+_etapa(etapa).n+'"', 'ok');
}

// ── Formulário ────────────────────────────────────────────────
function fmLead(id){
  var l = id ? LEADS.find(function(x){ return x && String(x.id)===String(id); }) : null;
  var novo = !l;
  l = l || { id:'', nome:'', telefone:'', email:'', veiculo_id:'', origem:'', vendedor:'',
             etapa:'novo', proximo_contato:'', troca:false, troca_desc:'', valor_proposta:'',
             obs:'', motivo_perda:'' };

  var veics = ((typeof DB!=='undefined' && DB.veiculos)||[]).filter(function(v){
    return v && (v.status!=='vendido' || String(v.id)===String(l.veiculo_id));
  });
  var users = ((typeof DB!=='undefined' && DB.usuarios)||[]).filter(Boolean);

  om('<div class="mb"><div class="mt2">'+(novo?'Novo interessado':'Editar interessado')+'</div></div>'
  + '<div style="padding:16px">'
  + '<div class="fr"><div class="fg"><label>Nome *</label><input id="lNome" value="'+_esc(l.nome)+'" placeholder="Nome do interessado"></div>'
  + '<div class="fg"><label>Telefone / WhatsApp *</label><input id="lTel" value="'+_esc(l.telefone)+'" placeholder="(75) 98888-7777"'
    + (typeof maskPhone==='function'?' oninput="this.value=maskPhone(this.value)"':'')+'></div></div>'
  + '<div class="fr"><div class="fg"><label>E-mail</label><input id="lMail" type="email" value="'+_esc(l.email)+'"></div>'
  + '<div class="fg"><label>Origem</label><select id="lOrigem"><option value="">—</option>'
    + ORIGENS.map(function(o){return '<option'+(l.origem===o?' selected':'')+'>'+_esc(o)+'</option>';}).join('')
    + '</select></div></div>'
  + '<div class="fr"><div class="fg"><label>Veículo de interesse</label><select id="lVeic"><option value="">—</option>'
    + veics.map(function(v){
        var nm=(v.marca||'')+' '+(v.modelo||'')+' '+(v.ano||'')+(v.placa?' · '+v.placa:'');
        return '<option value="'+_esc(v.id)+'"'+(String(l.veiculo_id)===String(v.id)?' selected':'')+'>'+_esc(nm)+'</option>';
      }).join('')
    + '</select></div>'
  + '<div class="fg"><label>Vendedor responsável</label><select id="lVend"><option value="">—</option>'
    + users.map(function(u){
        var v=u.login||u.id;
        return '<option value="'+_esc(v)+'"'+(l.vendedor===v?' selected':'')+'>'+_esc(u.nome||v)+'</option>';
      }).join('')
    + '</select></div></div>'
  + '<div class="fr"><div class="fg"><label>Etapa</label><select id="lEtapa">'
    + ETAPAS.map(function(e){return '<option value="'+e.k+'"'+((l.etapa||'novo')===e.k?' selected':'')+'>'+e.n+'</option>';}).join('')
    + '</select></div>'
  + '<div class="fg"><label>Próximo contato</label><input id="lProx" type="date" value="'+_esc(l.proximo_contato)+'"></div></div>'
  + '<div class="fr"><div class="fg"><label>Valor proposto (R$)</label><input id="lValor" value="'+_esc(l.valor_proposta)+'" placeholder="Ex: 78000"></div>'
  + '<div class="fg"><label>Tem carro na troca?</label>'
    + '<select id="lTroca" onchange="document.getElementById(\'lTrocaDesc\').style.display=this.value===\'1\'?\'block\':\'none\'">'
    + '<option value="0"'+(!l.troca?' selected':'')+'>Não</option>'
    + '<option value="1"'+(l.troca?' selected':'')+'>Sim</option></select></div></div>'
  + '<div class="fr"><div class="fg full"><input id="lTrocaDesc" placeholder="Qual carro ele dá na troca? (modelo, ano, km)" '
    + 'value="'+_esc(l.troca_desc)+'" style="display:'+(l.troca?'block':'none')+'"></div></div>'
  + '<div class="fr"><div class="fg full"><label>Observações</label><textarea id="lObs" placeholder="O que foi conversado, o que ele procura...">'+_esc(l.obs)+'</textarea></div></div>'
  + '<div class="fr"><div class="fg full"><label>Motivo, se perdido</label><input id="lPerda" value="'+_esc(l.motivo_perda)+'" placeholder="Ex: comprou em outra loja, crédito negado"></div></div>'
  + '</div>'
  + '<div class="mf">'
    + (novo?'':'<button class="btn bd" onclick="dlLead(\''+_esc(l.id)+'\')">Excluir</button>')
    + '<button class="btn bg2" onclick="cm()">Cancelar</button>'
    + '<button class="btn bp" onclick="svLead('+(novo?'null':'\''+_esc(l.id)+'\'')+')">Salvar</button></div>', true);
}

function svLead(id){
  var nome = (document.getElementById('lNome').value||'').trim();
  var tel  = (document.getElementById('lTel').value||'').trim();
  if (!nome || !tel) { toast('Preencha ao menos o nome e o telefone','err'); return; }

  var existente = id ? LEADS.find(function(x){ return x && String(x.id)===String(id); }) : null;
  var agora = new Date().toISOString();
  var etapa = document.getElementById('lEtapa').value;

  var obj = {
    id: id || ('l'+Date.now()),
    nome: nome,
    telefone: tel,
    email: (document.getElementById('lMail').value||'').trim(),
    veiculo_id: document.getElementById('lVeic').value,
    origem: document.getElementById('lOrigem').value,
    vendedor: document.getElementById('lVend').value,
    etapa: etapa,
    proximo_contato: document.getElementById('lProx').value,
    valor_proposta: (document.getElementById('lValor').value||'').trim(),
    troca: document.getElementById('lTroca').value === '1',
    troca_desc: (document.getElementById('lTrocaDesc').value||'').trim(),
    obs: (document.getElementById('lObs').value||'').trim(),
    motivo_perda: (document.getElementById('lPerda').value||'').trim(),
    criadoEm: (existente && existente.criadoEm) || agora,
    atualizadoEm: agora
  };
  if (etapa==='fechado') obj.fechadoEm = (existente && existente.fechadoEm) || agora;

  if (existente) LEADS = LEADS.map(function(x){ return (x && String(x.id)===String(id)) ? obj : x; });
  else LEADS.push(obj);

  salvarCacheLeads();
  if (typeof fsave==='function') fsave('leads', obj);
  cm();
  renderCRM();
  toast(existente?'Interessado atualizado':'Interessado cadastrado','ok');
}

function dlLead(id){
  if (!confirm('Excluir este interessado? Não dá para desfazer.')) return;
  LEADS = LEADS.filter(function(x){ return !(x && String(x.id)===String(id)); });
  salvarCacheLeads();
  if (typeof fdel==='function') fdel('leads', id);
  cm();
  renderCRM();
  toast('Interessado excluído','ok');
}

// ── Início ────────────────────────────────────────────────────
checkAuth(function(){
  applyProfile();
  renderCRM();
  Promise.all([
    (typeof loadFromFirestore==='function' ? loadFromFirestore() : Promise.resolve()),
    carregarLeads()
  ]).then(function(){
    _crmCarregando = false;
    renderCRM();
  }).catch(function(e){
    _crmCarregando = false;
    console.error('[crm.html]', e);
    renderCRM();
  });
});

</script>
<style>
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CRM: resumo ── */
.crm-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.crm-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.crm-kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-muted)}
.crm-kpi-v{font-size:24px;font-weight:800;margin-top:2px}
.crm-kpi-alerta{border-color:#dc2626}
.crm-kpi-alerta .crm-kpi-v{color:#dc2626}

/* ── CRM: filtros ── */
.crm-filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.crm-inp{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);
  color:var(--text);font-size:13px;font-family:inherit;min-width:170px}
.crm-inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
#crmQ{flex:1;min-width:240px}
.crm-chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--text-muted);cursor:pointer;white-space:nowrap}

/* ── CRM: quadro do funil ── */
.crm-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.crm-col{flex:0 0 250px;background:var(--bg-soft,rgba(128,128,128,.06));border:1px solid var(--border);
  border-radius:12px;padding:10px;min-height:130px;transition:background .15s,border-color .15s}
.crm-col-alvo{border-color:var(--accent);background:rgba(245,166,35,.10)}
.crm-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 2px}
.crm-dot{width:9px;height:9px;border-radius:50%;flex:none}
.crm-col-nome{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.crm-col-n{margin-left:auto;font-size:11px;font-weight:800;color:var(--text-muted);
  background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.crm-col-body{display:flex;flex-direction:column;gap:8px}
.crm-vazio{text-align:center;font-size:11px;color:var(--text-muted);padding:12px 0;opacity:.5}

/* ── CRM: card ── */
.crm-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;
  cursor:pointer;transition:box-shadow .15s,transform .1s}
.crm-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.13)}
.crm-card:active{transform:scale(.99)}
.crm-card-atraso{border-left:3px solid #dc2626}
.crm-card-nome{font-size:13px;font-weight:700;line-height:1.25}
.crm-card-carro{font-size:11px;color:var(--text-muted);margin-top:2px}
.crm-card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.crm-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  background:rgba(128,128,128,.16);border-radius:4px;padding:2px 6px}
.crm-tag-troca{background:rgba(139,92,246,.18);color:#8b5cf6}
.crm-card-data{font-size:10px;color:var(--text-muted);margin-top:7px;font-weight:600}
.crm-atraso-txt{color:#dc2626;font-weight:800}
.crm-card-pe{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;
  padding-top:7px;border-top:1px solid var(--border)}
.crm-vend{font-size:10px;color:var(--text-muted);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.crm-zap{font-size:10px;font-weight:700;color:#16a34a;text-decoration:none;white-space:nowrap}
.crm-zap:hover{text-decoration:underline}

@media(max-width:640px){
  .crm-col{flex:0 0 82vw}
}
</style>
