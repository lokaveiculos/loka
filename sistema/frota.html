<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Auth Guard -->
  <script>
  (function lokaAuthGuard() {
    const SESSION_KEY = 'loka_session';
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) { window.location.replace('index.html'); return; }
    try {
      const s = JSON.parse(atob(raw));
      if (s.exp <= Date.now()) {
        sessionStorage.removeItem(SESSION_KEY);
        window.location.replace('index.html');
      }
    } catch(e) {
      sessionStorage.removeItem(SESSION_KEY);
      window.location.replace('index.html');
    }
  })();
  </script>

<style>
:root{--blue:#2B4BF2;--dark:#0E1B4D;--green:#0d7a3e;--light:#EEF1FD;--border:#C5CCF5;--muted:#5a607a;--field:#F7F8FF;--amber:#b45309;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Montserrat",sans-serif;background:#f0f2fa;color:var(--dark);}
.hero{background:var(--dark);padding:22px 28px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(14,27,77,.3);}
.hero img{height:40px;}
.hero-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;}
.hero-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px;letter-spacing:.5px;}
.hero-stripe{height:4px;background:linear-gradient(90deg,var(--blue),#7B9BFF,var(--blue));}
.toolbar{max-width:100%;margin:20px auto 16px;padding:0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;}
.search-input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--border);border-radius:8px;font-family:"Montserrat",sans-serif;font-size:12px;background:#fff;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--blue);}
.filter-sel{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:"Montserrat",sans-serif;font-size:12px;background:#fff;outline:none;color:var(--dark);cursor:pointer;}
.stats-bar{max-width:100%;margin:0 auto 20px;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;}
.stat{background:#fff;border-radius:8px;padding:12px 18px;box-shadow:0 1px 6px rgba(14,27,77,.07);border-left:3px solid var(--blue);flex:1;min-width:120px;}
.stat-val{font-size:22px;font-weight:800;color:var(--dark);}
.stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:2px;}
.grid{max-width:100%;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(14,27,77,.07);overflow:hidden;transition:box-shadow .2s;border-top:3px solid var(--border);}
.card:hover{box-shadow:0 4px 20px rgba(14,27,77,.13);}
.card.saveiro-bau{border-top-color:#8b5cf6;}
.card.passeio{border-top-color:var(--blue);}
.card.utilitario{border-top-color:var(--amber);}
.card.premium{border-top-color:#0d7a3e;}
.card-head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;}
.card-modelo{font-size:13px;font-weight:800;color:var(--dark);}
.card-marca{font-size:10px;color:var(--muted);margin-top:2px;}
.card-placa{font-size:11px;font-weight:700;background:#f0f2fa;color:var(--muted);padding:3px 8px;border-radius:4px;letter-spacing:1px;}
.card-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;}
.card-row{display:flex;justify-content:space-between;font-size:11px;}
.card-row span:first-child{color:var(--muted);}
.card-row span:last-child{font-weight:600;color:var(--dark);}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid #f0f2fa;}
.price-box{background:var(--field);border-radius:6px;padding:8px 10px;text-align:center;}
.price-label{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.price-val{font-size:13px;font-weight:800;color:var(--blue);margin-top:2px;}
.price-val.green{color:var(--green);}
.badge-tipo{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;margin-top:6px;}
.badge-bau{background:#ede9fe;color:#7c3aed;}
.badge-passeio{background:var(--light);color:var(--blue);}
.badge-util{background:#fef3cd;color:var(--amber);}
.badge-premium{background:#e8f5ef;color:var(--green);}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);}
@media(max-width:600px){.hero{flex-direction:column;text-align:center;}.grid{grid-template-columns:1fr;}}
@media print{.hero{position:relative;}.toolbar,.stats-bar{display:none;}.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;}
.card{break-inside:avoid;}.card-head{padding:8px 10px 6px;}.card-body{padding:0 10px 8px;}.price-val{font-size:11px;}.card-modelo{font-size:11px;}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}}
</style>

<style>
/* ═══════ MOBILE OVERRIDES ═══════ */
@media (max-width: 768px) {
  .hero { flex-direction: column !important; gap: 8px; padding: 12px 14px !important; }
  .hero img { height: 32px !important; }
  .toolbar { flex-direction: column !important; padding: 10px 12px !important; gap: 8px !important; }
  .search-wrap, .filter-sel { width: 100% !important; }
  .stats-bar { padding: 0 12px !important; gap: 8px !important; }
  .stat { min-width: 80px; padding: 10px 12px !important; }
  .stat-val { font-size: 18px !important; }
  .grid { padding: 0 12px 24px !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .card-modelo { font-size: 12px !important; }
  .price-val { font-size: 11px !important; }
  .prices { grid-template-columns: 1fr 1fr !important; }
}
@media (max-width: 400px) {
  .grid { grid-template-columns: 1fr !important; }
}
</style>

function getTipo(v) {
  const m = (v.modelo||'').toLowerCase();
  if (m.includes('baú') || m.includes('bau')) return 'bau';
  if (['amarok','ranger','spin','renegade','fastback','onix plus at'].includes(m) || v.diaria >= 250) return 'premium';
  if (['fiorino','saveiro','strada'].some(x => m.includes(x))) return 'utilitario';
  return 'passeio';
}

function fmtBRL(n) { return 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

// Fill marca filter
const marcas = [...new Set(FROTA.map(v=>v.marca))].sort();
const mSel = document.getElementById('filtMarca');
marcas.forEach(m => { const o=document.createElement('option'); o.value=m; o.textContent=m; mSel.appendChild(o); });

// Stats
document.getElementById('statTotal').textContent = FROTA.length;
document.getElementById('statModelos').textContent = new Set(FROTA.map(v=>v.modelo)).size;
const diarias = FROTA.map(v=>v.diaria);
document.getElementById('statMenorDiaria').textContent = fmtBRL(Math.min(...diarias));
document.getElementById('statMaiorDiaria').textContent = fmtBRL(Math.max(...diarias));

const TIPO_BADGE = {
  bau: '<span class="badge-tipo badge-bau">📦 Baú</span>',
  passeio: '<span class="badge-tipo badge-passeio">🚗 Passeio</span>',
  utilitario: '<span class="badge-tipo badge-util">🔧 Utilitário</span>',
  premium: '<span class="badge-tipo badge-premium">⭐ Premium</span>',
};

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const marca = document.getElementById('filtMarca').value;
  const tipo = document.getElementById('filtTipo').value;
  const preco = document.getElementById('filtPreco').value;

  const rows = FROTA.filter(v => {
    const t = getTipo(v);
    if (q && !((v.modelo+v.placa+v.cor+v.marca).toLowerCase().includes(q))) return false;
    if (marca && v.marca !== marca) return false;
    if (tipo && t !== tipo) return false;
    if (preco) {
      const d = v.diaria;
      if (preco==='100-150' && d > 150) return false;
      if (preco==='151-200' && (d<=150||d>200)) return false;
      if (preco==='201-500' && (d<=200||d>500)) return false;
      if (preco==='501+' && d<=500) return false;
    }
    return true;
  });

  document.getElementById('statExibindo').textContent = rows.length;

  document.getElementById('grid').innerHTML = rows.length ? rows.map(v => {
    const t = getTipo(v);
    return `<div class="card ${t}">
      <div class="card-head">
        <div>
          <div class="card-modelo">${v.marca} ${v.modelo}</div>
          <div class="card-marca">${v.ano} · ${v.cor}</div>
          ${TIPO_BADGE[t]||''}
        </div>
        <div class="card-placa">${v.placa}</div>
      </div>
      <div class="card-body">
        <div class="prices">
          <div class="price-box">
            <div class="price-label">Diária 100km</div>
            <div class="price-val">${fmtBRL(v.diaria)}</div>
          </div>
          <div class="price-box">
            <div class="price-label">KM Livre</div>
            <div class="price-val">${fmtBRL(v.diaria_km_livre)}</div>
          </div>
          <div class="price-box">
            <div class="price-label">Mensal 3000km</div>
            <div class="price-val green">${fmtBRL(v.mensal)}</div>
          </div>
          <div class="price-box">
            <div class="price-label">Mensal KM Livre</div>
            <div class="price-val green">${fmtBRL(v.mensal_km_livre)}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="empty"><p style="font-size:14px;font-weight:700;">Nenhum veículo encontrado</p></div>';
}

render();
</script>

  <!-- User bar -->
  <div id="lokaUserBar" style="position:fixed;bottom:0;left:0;right:0;background:#07102e;
    border-top:1px solid rgba(255,255,255,.08);padding:6px 16px;
    display:flex;align-items:center;justify-content:space-between;z-index:9999;
    font-family:Montserrat,sans-serif;font-size:10px;color:rgba(255,255,255,.4);">
    <span id="lokaUserName">LOKÁ Sistema</span>
    <button onclick="lokaLogout()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
      color:rgba(255,255,255,.5);border-radius:4px;padding:3px 10px;font-family:Montserrat,sans-serif;
      font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;">
      Sair
    </button>
  </div>
  <script>
  (function showUser(){
    const u = sessionStorage.getItem('loka_user');
    if(u) {
      const d = JSON.parse(u);
      document.getElementById('lokaUserName').textContent = d.nome + ' · ' + d.perfil.toUpperCase();
    }
  })();
  function lokaLogout(){
    sessionStorage.removeItem('loka_session');
    sessionStorage.removeItem('loka_user');
    window.location.replace('index.html');
  }
  </script>

</body>
</html>
