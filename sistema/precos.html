<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --blue:#2B4BF2; --dark:#0E1B4D; --green:#0d7a3e; --yellow:#FFC72C; --muted:#5a607a; --light:#EEF1FD; --field:#F7F8FF; --border:#C5CCF5; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f4f6fb; color:#1a2340; padding-bottom:40px; }
  .wrap { max-width:640px; margin:0 auto; }
  .header { background:linear-gradient(160deg,#0E1B4D 0%,#1a2d6b 100%); color:#fff; text-align:center; padding:30px 20px 26px; }
  .header img { height:56px; margin-bottom:12px; }
  .header h1 { font-size:22px; font-weight:800; letter-spacing:.5px; }
  .header p { color:#aab4e0; font-size:13px; margin-top:5px; }
  .content { padding:20px 16px; }
  .cat-card { background:#fff; border-radius:16px; margin-bottom:14px; overflow:hidden; box-shadow:0 2px 12px rgba(14,27,77,.08); }
  .cat-top { display:flex; align-items:center; gap:14px; padding:16px 18px; background:linear-gradient(135deg,var(--dark),#243a7a); color:#fff; }
  .cat-emoji { font-size:34px; }
  .cat-nome { font-size:18px; font-weight:800; }
  .cat-desc { font-size:12px; color:#c5ccf5; margin-top:2px; }
  .cat-modelos { padding:10px 18px; background:var(--light); font-size:12px; color:var(--muted); }
  .cat-modelos b { color:var(--dark); }
  .precos { display:flex; }
  .preco-box { flex:1; text-align:center; padding:18px 10px; }
  .preco-box:first-child { border-right:1px solid var(--border); }
  .preco-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .preco-val { font-size:24px; font-weight:800; color:var(--blue); margin-top:4px; }
  .preco-per { font-size:11px; color:var(--muted); }
  .cta { background:linear-gradient(135deg,var(--blue),#1a35c7); border-radius:16px; padding:22px; text-align:center; color:#fff; margin-top:8px; }
  .cta h3 { font-size:17px; font-weight:800; margin-bottom:6px; }
  .cta p { font-size:13px; color:#dbe2ff; margin-bottom:14px; }
  .cta a { display:inline-block; background:#25D366; color:#fff; text-decoration:none; padding:13px 26px; border-radius:11px; font-weight:800; font-size:15px; }
  .obs { font-size:11px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.6; }
  .footer { text-align:center; font-size:11px; color:var(--muted); padding:20px; }
</style>
