<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOKÁ – Redirecionando...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Montserrat,sans-serif;background:#07102e;min-height:100vh;
display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:13px;}
</style>
</head>
<body>
<p>Redirecionando...</p>
<script>
(function() {
  const SESSION_KEY = 'loka_session';
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (raw) {
      const s = JSON.parse(atob(raw));
      if (s.exp > Date.now()) {
        window.location.replace('gestao.html');
        return;
      }
    }
  } catch(e) {}
  // Não logado → vai para o login
  window.location.replace('../index.html');
})();
</script>
</body>
</html>
